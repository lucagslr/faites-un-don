<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Teste ton éligibilité au don de sang en 9 questions."
    />
    <meta name="theme-color" content="#b3202e" />
    <title>Faites un don — Test d'éligibilité au don de sang</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23b3202e' d='M12 2C8 8 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-3-7-7-13z'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #faf5f2;
        --card: #ffffff;
        --primary: #b3202e;
        --primary-dark: #8a1723;
        --primary-soft: #f6e3e4;
        --good: #2e7d32;
        --good-soft: #e8f2e9;
        --ink: #2b191c;
        --muted: #7c6468;
        --border: #ecdcda;
        --focus: #1d4ed8;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: 24px 16px;
        background:
          radial-gradient(circle at 85% 8%, rgba(179, 32, 46, 0.07), transparent 40%),
          radial-gradient(circle at 8% 92%, rgba(179, 32, 46, 0.05), transparent 45%),
          var(--bg);
        font-family: "Work Sans", system-ui, sans-serif;
        color: var(--ink);
        line-height: 1.5;
      }

      main {
        width: min(600px, 100%);
      }

      /* ---------- En-tête ---------- */

      header {
        text-align: center;
        margin-bottom: 22px;
      }

      .drop {
        width: 34px;
        height: 34px;
        margin-bottom: 6px;
        animation: float 3.5s ease-in-out infinite;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      h1 {
        margin: 0 0 4px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 650;
        font-size: clamp(1.9rem, 5.5vw, 2.6rem);
        line-height: 1.15;
        letter-spacing: -0.01em;
      }

      h1 em {
        font-style: italic;
        color: var(--primary);
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 0.98rem;
      }

      /* ---------- Carte ---------- */

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: 0 18px 44px rgba(120, 32, 40, 0.1);
        padding: clamp(20px, 4.5vw, 32px);
      }

      /* ---------- Progression ---------- */

      .progress-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 0.88rem;
        font-weight: 600;
        color: var(--muted);
      }

      .progress-track {
        position: relative;
        height: 6px;
        border-radius: 999px;
        background: var(--primary-soft);
        margin-bottom: 26px;
      }

      .progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #d64550, var(--primary));
        transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .progress-drop {
        position: absolute;
        top: 50%;
        left: 0%;
        width: 18px;
        height: 18px;
        transform: translate(-50%, -58%);
        transition: left 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* ---------- Question ---------- */

      #question-zone {
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      #question-zone.leaving {
        opacity: 0;
        transform: translateY(-8px);
      }

      #question-text {
        margin: 0 0 24px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-size: clamp(1.25rem, 3.8vw, 1.55rem);
        line-height: 1.35;
        min-height: 2.7em;
      }

      .answers {
        display: flex;
        gap: 12px;
      }

      .answer-btn {
        flex: 1;
        min-height: 52px;
        border-radius: 999px;
        padding: 12px 24px;
        font-family: inherit;
        font-size: 1.05rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      }

      .answer-btn[data-value="yes"] {
        border: 2px solid var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .answer-btn[data-value="yes"]:hover {
        background: var(--primary-dark);
        border-color: var(--primary-dark);
      }

      .answer-btn[data-value="no"] {
        border: 2px solid var(--ink);
        background: transparent;
        color: var(--ink);
      }

      .answer-btn[data-value="no"]:hover {
        background: var(--ink);
        color: #fff;
      }

      .answer-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px rgba(43, 25, 28, 0.15);
      }

      .answer-btn:active {
        transform: translateY(0);
      }

      /* ---------- Résultat ---------- */

      #result {
        border-radius: var(--radius);
        padding: 20px;
        font-size: 1.02rem;
        line-height: 1.55;
        outline: none;
      }

      #result h2 {
        margin: 0 0 8px;
        font-family: "Fraunces", Georgia, serif;
        font-weight: 650;
        font-size: 1.35rem;
      }

      #result.success {
        background: var(--good-soft);
        border: 1px solid rgba(46, 125, 50, 0.35);
        color: #1d4a20;
      }

      #result.error {
        background: var(--primary-soft);
        border: 1px solid rgba(179, 32, 46, 0.3);
        color: #6e1420;
      }

      #result .delay {
        display: block;
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed currentColor;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .secondary-btn {
        margin-top: 18px;
        min-height: 48px;
        width: 100%;
        border: 2px solid var(--border);
        border-radius: 999px;
        padding: 12px 24px;
        background: #fff;
        color: var(--ink);
        font-family: inherit;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
      }

      .secondary-btn:hover {
        background: var(--bg);
        transform: translateY(-2px);
      }

      /* ---------- Accessibilité ---------- */

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      .hidden {
        display: none !important;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* ---------- Petits écrans ---------- */

      @media (max-width: 420px) {
        .answers {
          flex-direction: column;
        }

        .card {
          box-shadow: 0 10px 26px rgba(120, 32, 40, 0.08);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <svg class="drop" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="#b3202e" d="M12 2C8 8 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-3-7-7-13z" />
          <path fill="#ffffff" opacity="0.35" d="M9.2 14.2a2.9 2.9 0 0 0 2 3.4c.5.14.8-.5.4-.85a3.6 3.6 0 0 1-1.3-2.3c-.07-.55-.96-.8-1.1-.25z" />
        </svg>
        <h1>Faites <em>un don</em></h1>
        <p class="subtitle">Le test d'éligibilité de Luca — 9 questions, 1 minute</p>
      </header>

      <div class="card">
        <div id="question-box">
          <div class="progress-row">
            <span id="progress-label">Question 1 sur 9</span>
            <span id="progress-percent" aria-hidden="true">0&nbsp;%</span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-labelledby="progress-label"
            aria-valuemin="0"
            aria-valuemax="9"
            aria-valuenow="0"
            id="progress-track"
          >
            <div class="progress-fill" id="progress-fill"></div>
            <svg class="progress-drop" id="progress-drop" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="#8a1723" d="M12 2C8 8 5 11.5 5 15a7 7 0 0 0 14 0c0-3.5-3-7-7-13z" />
            </svg>
          </div>

          <div id="question-zone" aria-live="polite">
            <h2 id="question-text"></h2>
            <div class="answers">
              <button type="button" class="answer-btn" data-value="yes">Oui</button>
              <button type="button" class="answer-btn" data-value="no">Non</button>
            </div>
          </div>
        </div>

        <div id="result" class="hidden" role="status" tabindex="-1"></div>
        <button type="button" id="restart" class="secondary-btn hidden">
          Recommencer le test
        </button>
      </div>
    </main>

    <script>
      const questions = [
        {
          text: 'Pèses-tu plus de 50 kg ?',
          validAnswer: 'yes',
          rejectText: 'Tu ne peux pas faire de don, car tu pèses moins de 50 kg.',
          delay: "Report jusqu'à l'atteinte du poids minimal de 50 kg."
        },
        {
          text: 'As-tu fait un tatouage ou un piercing au cours des 4 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as fait un tatouage ou un piercing récemment.',
          delay: '4 mois à compter de la date de réalisation.'
        },
        {
          text: 'As-tu eu un soin ou un traitement dentaire au cours des 14 derniers jours ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as eu un soin dentaire récemment.',
          delay: '14 jours après la fin du traitement.'
        },
        {
          text: 'As-tu consommé des drogues par voie injectable au cours des 4 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as consommé des substances par voie injectable.',
          delay: "4 mois minimum, ou définitif selon l'évaluation médicale."
        },
        {
          text: "Prends-tu un traitement oral contre l'acné (ex. Roaccutane, Curakné, isotrétinoïne) ?",
          validAnswer: 'no',
          rejectText: "Tu ne peux pas faire de don, car tu prends un traitement anti-acnéique à base d'isotrétinoïne.",
          delay: "4 semaines après l'arrêt complet du traitement."
        },
        {
          text: 'As-tu eu un nouveau ou une nouvelle partenaire sexuel·le au cours des 4 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as un nouveau ou une nouvelle partenaire récent·e.',
          delay: '4 mois à compter du début de la nouvelle relation.'
        },
        {
          text: 'As-tu eu plus de 2 partenaires sexuel·les différent·es au cours des 4 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as eu plus de 2 partenaires durant les 4 derniers mois.',
          delay: '4 mois.'
        },
        {
          text: 'As-tu voyagé dans une zone à risque infectieux (paludisme, dengue, Zika, virus du Nil occidental) au cours des 3 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as séjourné récemment dans une région à risque.',
          delay: 'De 1 à 6 mois selon la destination.'
        },
        {
          text: 'As-tu été vacciné·e contre la rage au cours des 12 derniers mois ?',
          validAnswer: 'no',
          rejectText: 'Tu ne peux pas faire de don, car tu as été vacciné·e contre la rage récemment.',
          delay: '12 mois après le vaccin.'
        }
      ];

      const state = { index: 0 };

      const progressLabel = document.getElementById('progress-label');
      const progressPercent = document.getElementById('progress-percent');
      const progressTrack = document.getElementById('progress-track');
      const progressFill = document.getElementById('progress-fill');
      const progressDrop = document.getElementById('progress-drop');
      const questionBox = document.getElementById('question-box');
      const questionZone = document.getElementById('question-zone');
      const questionTextEl = document.getElementById('question-text');
      const resultEl = document.getElementById('result');
      const restartBtn = document.getElementById('restart');
      const answerButtons = Array.from(document.querySelectorAll('.answer-btn'));

      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function updateProgress() {
        const done = state.index;
        const percent = Math.round((done / questions.length) * 100);
        progressLabel.textContent = `Question ${state.index + 1} sur ${questions.length}`;
        progressPercent.textContent = `${percent} %`;
        progressTrack.setAttribute('aria-valuenow', String(done));
        progressFill.style.width = `${percent}%`;
        progressDrop.style.left = `${percent}%`;
      }

      function renderQuestion() {
        questionTextEl.textContent = questions[state.index].text;
        updateProgress();
      }

      function showQuestion() {
        if (reducedMotion) {
          renderQuestion();
          return;
        }
        questionZone.classList.add('leaving');
        setTimeout(() => {
          renderQuestion();
          questionZone.classList.remove('leaving');
        }, 180);
      }

      function fillProgressComplete() {
        progressLabel.textContent = `Test terminé — ${questions.length} questions`;
        progressPercent.textContent = '100 %';
        progressTrack.setAttribute('aria-valuenow', String(questions.length));
        progressFill.style.width = '100%';
        progressDrop.style.left = '100%';
      }

      function showResult({ title, message, delay, isSuccess }) {
        questionZone.classList.add('hidden');
        resultEl.className = isSuccess ? 'success' : 'error';
        resultEl.innerHTML = '';

        const heading = document.createElement('h2');
        heading.textContent = title;
        const body = document.createElement('p');
        body.style.margin = '0';
        body.textContent = message;
        resultEl.append(heading, body);

        if (delay) {
          const delayEl = document.createElement('span');
          delayEl.className = 'delay';
          delayEl.textContent = `Délai : ${delay}`;
          resultEl.appendChild(delayEl);
        }

        restartBtn.classList.remove('hidden');
        resultEl.focus();
      }

      function handleAnswer(answer) {
        const current = questions[state.index];

        if (answer !== current.validAnswer) {
          updateProgress();
          showResult({
            title: 'Pas cette fois…',
            message: current.rejectText,
            delay: current.delay,
            isSuccess: false
          });
          return;
        }

        if (state.index < questions.length - 1) {
          state.index += 1;
          showQuestion();
          return;
        }

        fillProgressComplete();
        showResult({
          title: 'Bravo, tu peux donner !',
          message:
            "Tu remplis une bonne partie des conditions qui te permettent de faire un don de sang ! Tu vas même repartir avec des jetons magiques qui t'ouvrent directement les portes de la cafétéria pour te faire plaisir après ton don !",
          isSuccess: true
        });
      }

      answerButtons.forEach((button) => {
        button.addEventListener('click', () => handleAnswer(button.dataset.value));
      });

      restartBtn.addEventListener('click', () => {
        state.index = 0;
        resultEl.className = 'hidden';
        resultEl.innerHTML = '';
        restartBtn.classList.add('hidden');
        questionZone.classList.remove('hidden');
        renderQuestion();
        answerButtons[0].focus();
      });

      renderQuestion();
    </script>
  </body>
</html>
